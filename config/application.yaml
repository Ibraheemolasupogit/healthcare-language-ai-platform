application_name: Healthcare Language AI Platform
environment: local
log_level: INFO
log_format: console
data_root: data
output_root: outputs
report_root: reports
synthetic_data_only: true
max_document_text_length: 20000
deterministic_seed: 42
synthetic_generation:
  default_record_count: 15
  allowed_document_types:
    - clinical_note
    - discharge_summary
    - referral_letter
    - radiology_report
    - pathology_report
  reference_timestamp: "2026-01-01T09:00:00+00:00"
  generator_seed: 2026
  generator_version: "1.0.0"
  template_version: "1.0.0"
  vocabulary_version: "1.0.0"
  maximum_records_per_run: 500
  output_format: jsonl
  include_annotations: true
ingestion:
  default_ingestion_mode: strict
  default_output_root: outputs/ingestion
  ingestion_reference_timestamp: "2026-01-02T09:00:00+00:00"
  maximum_source_records: 1000
  allowed_source_roots:
    - tests/fixtures
    - outputs
  follow_symlinks: false
  default_overwrite_policy: fail_if_exists
  write_csv: true
  write_parquet: true
  csv_null_value: ""
  parquet_compression: zstd
  ingestion_contract_version: "1.0.0"
  snowflake_contract_version: "1.0.0"
  snowflake_target_database: HEALTHCARE_LANGUAGE_AI
  snowflake_raw_schema: RAW
  snowflake_staging_schema: STAGING
  snowflake_governance_schema: GOVERNANCE
preprocessing:
  default_preprocessing_mode: conservative
  default_output_root: outputs/preprocessing
  preprocessing_reference_timestamp: "2026-01-03T09:00:00+00:00"
  maximum_documents_per_run: 1000
  allowed_ingestion_roots:
    - tests/fixtures/ingestion
    - outputs/ingestion
  follow_symlinks: false
  default_overwrite_policy: fail_if_exists
  write_csv: true
  write_parquet: true
  unicode_normalisation_form: NFC
  tab_width: 4
  collapse_repeated_spaces: true
  preserve_final_newline: true
  maximum_sentence_length: 500
  minimum_document_length: 80
  preprocessing_contract_version: "1.0.0"
  normalisation_version: "1.0.0"
  section_parser_version: "1.0.0"
  sentence_segmenter_version: "1.0.0"
  tokeniser_version: "1.0.0"
  quality_rules_version: "1.0.0"
  databricks_contract_version: "1.0.0"
  databricks_catalog_placeholder: hla_catalog_placeholder
  databricks_bronze_schema: bronze
  databricks_silver_schema: silver
  databricks_gold_schema: gold
extraction:
  default_output_root: outputs/extraction
  extraction_reference_timestamp: "2026-01-04T09:00:00+00:00"
  maximum_documents_per_extraction_run: 1000
  allowed_preprocessing_roots:
    - tests/fixtures/preprocessing
    - outputs/preprocessing
  default_text_representation: normalised_text
  case_sensitive_matching: false
  word_boundary_required: true
  allow_overlapping_predictions: false
  default_overwrite_policy: fail_if_exists
  write_csv: true
  write_parquet: true
  extraction_contract_version: "1.0.0"
  entity_rule_version: "1.0.0"
  classification_rule_version: "1.0.0"
  overlap_resolution_version: "1.0.0"
  vocabulary_version: "1.0.0"
evaluation:
  default_output_root: outputs/evaluation
  evaluation_reference_timestamp: "2026-01-05T09:00:00+00:00"
  default_matching_policy: exact
  relaxed_overlap_threshold: 0.5
  context_window_characters: 32
  maximum_error_records: 1000
  default_overwrite_policy: fail_if_exists
  write_csv: true
  write_parquet: true
  evaluation_contract_version: "1.0.0"
  metrics_version: "1.0.0"
  error_analysis_version: "1.0.0"
  mlflow_contract_version: "1.0.0"
retrieval:
  default_index_output_root: outputs/retrieval/indexes
  default_retrieval_output_root: outputs/retrieval/runs
  default_retrieval_evaluation_output_root: outputs/retrieval/evaluation
  index_reference_timestamp: "2026-01-06T09:00:00+00:00"
  retrieval_reference_timestamp: "2026-01-07T09:00:00+00:00"
  retrieval_evaluation_reference_timestamp: "2026-01-08T09:00:00+00:00"
  maximum_retrieval_units: 10000
  maximum_queries: 500
  default_unit_types: all
  default_text_representation: normalised_text
  default_retrieval_strategy: hybrid
  default_top_k: 5
  evaluation_k_values: [1, 3, 5, 10]
  corpus_version: "1.0.0"
  retrieval_contract_version: "1.0.0"
  tokeniser_version: "1.0.0"
  keyword_version: "1.0.0"
  tfidf_version: "1.0.0"
  bm25_version: "1.0.0"
  hash_embedding_version: "1.0.0"
  hybrid_version: "1.0.0"
  retrieval_evaluation_contract_version: "1.0.0"
  retrieval_metrics_version: "1.0.0"
  retrieval_failure_version: "1.0.0"
  embedding_dimension: 32
  hash_ngram_min: 1
  hash_ngram_max: 2
  bm25_k1: 1.5
  bm25_b: 0.75
  keyword_weight: 0.15
  tfidf_weight: 0.25
  bm25_weight: 0.4
  dense_weight: 0.15
  metadata_weight: 0.05
  relaxed_filter_policy: pre_filter
  snippet_character_limit: 96
  default_overwrite_policy: fail_if_exists
  vector_search_contract_version: "1.0.0"
