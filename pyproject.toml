[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "healthcare-language-ai"
version = "0.1.0"
description = "Educational foundation for a synthetic-data healthcare language AI platform."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Healthcare Language AI Platform" }]
keywords = ["healthcare", "nlp", "synthetic-data", "portfolio", "governance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "fastapi>=0.111,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "pyarrow>=16,<23",
  "PyYAML>=6.0,<7",
  "streamlit>=1.36,<2",
  "structlog>=24.2,<26",
  "typer>=0.12,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dense-local = [
  "sentence-transformers>=3.0,<6",
  "torch>=2.3,<3",
]
dev = [
  "jsonschema>=4.22,<5",
  "mypy>=1.10,<2",
  "pytest>=8.2,<9",
  "pytest-cov>=5,<8",
  "ruff>=0.5,<1",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
healthcare-language-ai = "healthcare_language_ai.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/healthcare_language_ai"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "N", "PTH", "RUF", "UP", "W"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "--strict-markers --strict-config --cov=healthcare_language_ai --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["healthcare_language_ai"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
